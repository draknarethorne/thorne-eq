# MariaDB config template for Thorne-EQ (portable, local dev).
# Rendered to C:/Thorne-EQ/mariadb/my.ini by: manage_database.py bootstrap
[mysqld]
datadir=C:/Thorne-EQ/mariadb/data
tmpdir=C:/Thorne-EQ/mariadb/tmp
port=3306
bind-address=127.0.0.1
innodb_buffer_pool_size=512M
max_allowed_packet=256M
innodb_temp_data_file_path=ibtmp1:12M:autoextend
sql_mode=NO_ENGINE_SUBSTITUTION
character-set-server=utf8
# Auto-repair crashed MyISAM/Aria tables on open (survives abrupt shutdowns).
myisam-recover-options=BACKUP,FORCE
aria-recover-options=BACKUP,FORCE

[client]
port=3306
default-character-set=utf8
